<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPNames Search</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ========== HEADER ========== -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="app-logo">✦</span>
      <h1>MPNames Search</h1>
      <span id="datasetMeta" class="dataset-meta">Loading…</span>
    </div>
    <div class="topbar-right">
      <div class="metric-chip">
        <span class="metric-label">Named Objects</span>
        <strong id="totalObjects">—</strong>
      </div>
    </div>
  </header>

  <!-- ========== SEARCH BAR + FILTER TAGS ========== -->
  <div class="searchbar-zone">
    <div class="searchbar-row">
      <label class="search-input-wrap" for="query">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="query" type="search" placeholder="検索キーワードを入力 例: Broca, Apollo, !mythology">
        <kbd id="clearQuery" class="clear-kbd" title="クリア" hidden>✕</kbd>
      </label>
      <select id="queryMode" class="query-mode-select" aria-label="検索キーワードの結合条件">
        <option value="and" selected>AND</option>
        <option value="or">OR</option>
      </select>
      <select id="queryTarget" class="query-mode-select" aria-label="検索対象">
        <option value="both" selected>名前+Citation</option>
        <option value="name">名前のみ</option>
        <option value="citation">Citationのみ</option>
      </select>
      <button id="filterMenuBtn" class="filter-menu-btn" type="button">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 5h14M6 10h8M9 15h2"/></svg>
        絞り込み
        <span id="filterBadgeCount" class="filter-badge" hidden></span>
      </button>
      <button id="clearAllFiltersBtn" class="secondary inline-reset-btn" type="button" hidden>条件クリア</button>
      <div class="sort-controls">
        <select id="sortField" aria-label="並び替え項目">
          <option value="alpha">名前順</option>
          <option value="number" selected>番号順</option>
          <option value="absolute_magnitude">等級順</option>
          <option value="semimajor_axis">軌道長半径順</option>
          <option value="eccentricity">離心率順</option>
          <option value="inclination">傾斜角順</option>
        </select>
        <select id="sortDirection" aria-label="並び順">
          <option value="asc" selected>↑ 昇順</option>
          <option value="desc">↓ 降順</option>
        </select>
      </div>
    </div>

    <div id="activeFilterTags" class="active-filter-tags" aria-label="Active filters"></div>
    <p id="queryHelp" class="query-help">Enterで複数キーワードを追加、!キーワードで除外検索できます。</p>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="main-content">
    <!-- Left: result list (70%) -->
    <section class="results-panel" aria-label="Search results">
      <div class="results-header">
        <p id="resultSummary" class="result-summary">—</p>
        <div class="pager">
          <button id="firstPage" class="icon-button" type="button" aria-label="先頭ページ">«</button>
          <button id="prevPage" class="icon-button" type="button" aria-label="前ページ">‹</button>
          <div class="page-selector">
            <button id="pageDropdownBtn" class="page-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="ページ選択">
              <span id="pageLabel">1 / 1</span>
              <span class="page-btn-icon">▼</span>
            </button>
            <div id="pageDropdown" class="page-dropdown" role="listbox" hidden></div>
          </div>
          <button id="nextPage" class="icon-button" type="button" aria-label="次ページ">›</button>
          <button id="lastPage" class="icon-button" type="button" aria-label="末尾ページ">»</button>
        </div>
      </div>
      <div id="results" class="result-list"></div>
    </section>

    <!-- Right: detail + wordcloud (30%) -->
    <aside class="side-panel">
      <div class="side-panel-detail">
        <div class="panel-title">詳細</div>
        <div id="detailBody" class="detail-body">リストから天体を選択してください。</div>
      </div>
      <div class="side-panel-wordcloud">
        <div class="panel-title">
          キーワード頻度
          <span id="wordCount" class="word-count-badge">—</span>
        </div>
        <div id="wordCloud" class="word-cloud" aria-label="Keyword frequency"></div>
      </div>
    </aside>
  </div>

  <!-- ========== FILTER MODAL ========== -->
  <div id="filterModal" class="modal-overlay" aria-modal="true" role="dialog" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2>絞り込み条件</h2>
        <button id="filterModalClose" class="modal-close" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <div class="filter-section">
          <div class="filter-section-title">軌道分類</div>
          <div id="orbitFilters" class="check-list" aria-label="軌道フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title">命名カテゴリ</div>
          <div id="citationFilters" class="check-list" aria-label="命名カテゴリフィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title">発見者</div>
          <div id="discovererFilters" class="check-list" aria-label="発見者フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title">観測所</div>
          <div id="observatoryFilters" class="check-list" aria-label="観測所フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title">フラグ</div>
          <div id="flagFilters" class="check-list compact" aria-label="フラグフィルタ"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="resetFilters" class="secondary" type="button">すべてリセット</button>
        <button id="filterModalApply" class="primary" type="button">適用</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <span>Data source: <a href="https://www.minorplanetcenter.net/" target="_blank" rel="noopener noreferrer">IAU Minor Planet Center</a></span>
  </footer>
</body>
</html>
