<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minor Planet Names</title>
  <meta name="description" content="Search and explore named minor planets by name, naming citation, and orbital classification.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#16191a">
  <link rel="canonical" href="https://mpnames.pages.dev/">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta property="og:site_name" content="Minor Planet Names">
  <meta property="og:title" content="Minor Planet Names">
  <meta property="og:description" content="Search and explore named minor planets by name, naming citation, and orbital classification.">
  <meta property="og:url" content="https://mpnames.pages.dev/">
  <meta property="og:image" content="https://mpnames.pages.dev/ogp.png">
  <meta property="og:image:secure_url" content="https://mpnames.pages.dev/ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Minor Planet Names">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Minor Planet Names">
  <meta name="twitter:description" content="Search and explore named minor planets by name, naming citation, and orbital classification.">
  <meta name="twitter:image" content="https://mpnames.pages.dev/ogp.png">
  <meta name="twitter:image:alt" content="Minor Planet Names">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ========== HEADER ========== -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="app-logo">✦</span>
      <h1 data-i18n="header.title">Minor Planet Names</h1>
      <span id="datasetMeta" class="dataset-meta" data-i18n="header.dataset_meta_loading">Loading…</span>
    </div>
    <div class="topbar-right">
      <select id="langSwitch" class="lang-switch" aria-label="Language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
      <div class="metric-chip">
        <span class="metric-label" data-i18n="header.named_objects">Named Objects</span>
        <strong id="totalObjects">—</strong>
      </div>
    </div>
  </header>

  <!-- ========== SEARCH BAR + FILTER TAGS ========== -->
  <div class="searchbar-zone">
    <div class="searchbar-row">
      <label class="search-input-wrap" for="query">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="query" type="search" placeholder="検索" data-i18n="search.placeholder">
        <kbd id="clearQuery" class="clear-kbd" title="クリア" hidden>✕</kbd>
      </label>
      <div class="search-scroll-container" id="searchScrollContainer">
        <div class="search-controls-row" id="searchControlsRow">
        <select id="queryMode" class="query-mode-select" aria-label="検索キーワードの結合条件">
          <option value="and" selected data-i18n="search.mode_and">AND</option>
          <option value="or" data-i18n="search.mode_or">OR</option>
        </select>
        <select id="queryTarget" class="query-mode-select" aria-label="検索対象">
          <option value="both" selected data-i18n="search.target_both">名前+Citation</option>
          <option value="name" data-i18n="search.target_name">名前のみ</option>
          <option value="citation" data-i18n="search.target_citation">Citationのみ</option>
        </select>
        <button id="filterMenuBtn" class="filter-menu-btn" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M3 5h14M6 10h8M9 15h2" />
          </svg>
          <span data-i18n="search.filter_btn">絞り込み</span>
          <span id="filterBadgeCount" class="filter-badge" hidden></span>
        </button>
        <button id="clearAllFiltersBtn" class="secondary inline-reset-btn" type="button" hidden data-i18n="search.clear_all">条件クリア</button>
        <div class="sort-controls">
          <select id="sortField" aria-label="並び替え項目">
            <option value="alpha" selected data-i18n="sort.alpha">名前順</option>
            <option value="number" data-i18n="sort.number">番号順</option>
            <option value="absolute_magnitude" data-i18n="sort.absolute_magnitude">等級順</option>
            <option value="semimajor_axis" data-i18n="sort.semimajor_axis">軌道長半径順</option>
            <option value="eccentricity" data-i18n="sort.eccentricity">離心率順</option>
            <option value="inclination" data-i18n="sort.inclination">傾斜角順</option>
          </select>
          <select id="sortDirection" aria-label="並び順">
            <option value="asc" selected data-i18n="sort.asc">↑ 昇順</option>
            <option value="desc" data-i18n="sort.desc">↓ 降順</option>
          </select>
        </div><!-- /.sort-controls -->
        </div><!-- /.search-controls-row -->
      </div><!-- /.search-scroll-container -->
    </div><!-- /.searchbar-row -->

    <div id="activeFilterTags" class="active-filter-tags" aria-label="Active filters"></div>
    <p id="queryHelp" class="query-help" data-i18n="search.help">Enterで複数キーワードを追加、!キーワードで除外検索できます。</p>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="main-content">
    <!-- Left: result list (70%) -->
    <section class="results-panel" aria-label="Search results">
      <div class="results-header">
        <p id="resultSummary" class="result-summary">—</p>
        <div class="pager">
          <button id="firstPage" class="icon-button" type="button" aria-label="先頭ページ">«</button>
          <button id="prevPage" class="icon-button" type="button" aria-label="前ページ">‹</button>
          <div class="page-selector">
            <button id="pageDropdownBtn" class="page-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="ページ選択">
              <span id="pageLabel">1 / 1</span>
              <span class="page-btn-icon">▼</span>
            </button>
            <div id="pageDropdown" class="page-dropdown" role="listbox" hidden></div>
          </div>
          <button id="nextPage" class="icon-button" type="button" aria-label="次ページ">›</button>
          <button id="lastPage" class="icon-button" type="button" aria-label="末尾ページ">»</button>
        </div>
      </div>
      <div id="results" class="result-list"></div>
      <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
      </div>
    </section>

    <!-- Right: selected object detail (30%) -->
    <aside id="sidePanel" class="side-panel">
      <!-- Mobile: detail button + close button -->
      <div class="side-panel-mobile-header">
        <div class="side-tabs">
          <button class="side-tab active" id="tabDetail" type="button" data-i18n="side.tab_detail">詳細</button>
        </div>
        <button id="closeSidePanel" class="close-side-panel" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="side-panel-detail" id="sideTabDetail">
        <div class="panel-title" data-i18n="side.detail_title">詳細</div>
        <div id="detailBody" class="detail-body" data-i18n="side.detail_empty">リストから天体を選択してください。</div>
      </div>
    </aside>
  </div>

  <!-- モバイル用詳細パネル背景オーバーレイ -->
  <div id="mobileDetailOverlay" class="mobile-detail-overlay" hidden></div>

  <!-- ========== FILTER MODAL ========== -->
  <div id="filterModal" class="modal-overlay" aria-modal="true" role="dialog" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 data-i18n="modal.title">絞り込み条件</h2>
        <button id="filterModalClose" class="modal-close" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.orbit">軌道分類</div>
          <div id="orbitFilters" class="check-list" aria-label="軌道フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.citation">命名カテゴリ</div>
          <div id="citationFilters" class="check-list" aria-label="命名カテゴリフィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.person_role">人物ロール</div>
          <div id="personRoleFilters" class="check-list" aria-label="人物ロールフィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.gender">性別</div>
          <div id="genderFilters" class="check-list compact" aria-label="性別フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.discoverer">発見者</div>
          <div id="discovererFilters" class="check-list" aria-label="発見者フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.observatory">観測所</div>
          <div id="observatoryFilters" class="check-list" aria-label="観測所フィルタ"></div>
        </div>
        <div class="filter-section">
          <div class="filter-section-title" data-i18n="modal.flag">フラグ</div>
          <div id="flagFilters" class="check-list compact" aria-label="フラグフィルタ"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="resetFilters" class="secondary" type="button" data-i18n="modal.reset">すべてリセット</button>
        <button id="filterModalApply" class="primary" type="button" data-i18n="modal.apply">適用</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/i18next@23.10.1/i18next.min.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <span>Data source: <a href="https://www.minorplanetcenter.net/" target="_blank" rel="noopener noreferrer">IAU Minor Planet Center</a></span>
    <a class="footer-github" href="https://github.com/kn1cht/MinorPlanetNamesSearch" target="_blank" rel="noopener noreferrer">
      <span class="footer-github-icon" aria-hidden="true"></span>
      <span>kn1cht/MinorPlanetNamesSearch</span>
    </a>
  </footer>
</body>
</html>
